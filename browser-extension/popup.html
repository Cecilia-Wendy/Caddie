<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Caddie 网申采集器</title></head>
<body><main><header><div class="logo">C</div><div><h1>保存到 Caddie</h1><p>读取当前已填写的网申，不会自动提交</p></div></header><div id="status" class="status">正在读取页面…</div><section id="form" hidden><label>公司<select id="company"></select></label><label>岗位<select id="track"><option value="">不指定岗位</option></select></label><div class="summary"><b id="count">0 个字段</b><span id="groups">0 个章节</span></div><div id="preview" class="preview"></div><div class="privacy">已自动排除密码、验证码、身份证、银行卡和隐藏字段。</div><button id="save">保存这份网申</button></section></main><script src="popup.js"></script></body></html>
