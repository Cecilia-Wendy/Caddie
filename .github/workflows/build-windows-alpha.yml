name: Build Windows Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deploy/online-caddie
    paths:
      - "**.py"
      - "static/**"
      - "integrations/**"
      - "assets/**"
      - "requirements-desktop.txt"
      - "requirements-build.txt"
      - "caddie-windows.spec"
      - "scripts/build-windows-alpha.ps1"
      - ".github/workflows/build-windows-alpha.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-desktop.txt -r requirements-build.txt

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build-windows-alpha.ps1

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\Caddie\Caddie.exe" -ArgumentList "--agent-cli", "guide" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged CLI smoke test failed: $($process.ExitCode)" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Caddie-windows-x64
          path: dist/Caddie-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
