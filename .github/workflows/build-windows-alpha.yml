name: Build Windows Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deploy/online-caddie
    paths:
      - "**.py"
      - "static/**"
      - "integrations/**"
      - "assets/**"
      - "requirements-desktop.txt"
      - "requirements-build.txt"
      - "caddie-windows.spec"
      - "scripts/build-windows-alpha.ps1"
      - ".github/workflows/build-windows-alpha.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-desktop.txt -r requirements-build.txt

      - name: Build Windows package
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "from pathlib import Path; Path('main.py').read_text(encoding='utf-8').encode('gbk')"
          .\scripts\build-windows-alpha.ps1

      - name: Smoke test packaged desktop server
        shell: pwsh
        run: |
          $env:CADDIE_HEADLESS = "1"
          $env:CADDIE_DATA_DIR = Join-Path $env:RUNNER_TEMP "caddie-smoke"
          $env:CADDIE_STARTUP_LOG = Join-Path $env:RUNNER_TEMP "caddie-startup.log"
          $process = Start-Process -FilePath ".\dist\Caddie\Caddie.exe" -PassThru
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) {
                if (Test-Path $env:CADDIE_STARTUP_LOG) { Get-Content $env:CADDIE_STARTUP_LOG }
                throw "Packaged desktop exited before the server became ready: $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8766/" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              if (Test-Path $env:CADDIE_STARTUP_LOG) { Get-Content $env:CADDIE_STARTUP_LOG }
              throw "Packaged desktop server was not ready within 90 seconds"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Caddie-windows-x64
          path: dist/Caddie-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
